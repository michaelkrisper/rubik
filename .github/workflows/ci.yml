name: CI

# Checks every push and pull request (lint, unit tests with coverage, browser
# test) and then deploys main to krisperapps.de.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx biome ci
      - run: npm run test:coverage

      # A rendered, scrambled cube as fake camera (automatic capture), plus
      # gallery upload, face-by-face scan, solver and 3D animation.
      # Chrome is preinstalled on the runner.
      - run: npm run test:e2e -- '' e2e-screenshots
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-screenshots

  # Tags every tested commit on main with the next patch version (vX.Y.Z).
  version:
    name: Version tag
    needs: [check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: python3 .github/scripts/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}

  # Publishes to the own server (https://rubik.krisperapps.de/). The key may
  # only write into this app's folder there; this job runs no code from the repo.
  # js/version.js gets the release tag, which the start screen shows.
  server:
    name: krisperapps.de
    # Only commits that got a version tag: a re-run of an older run deploys nothing.
    needs: [check, version]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    concurrency:
      group: server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir _site
          cp -r index.html style.css sw.js worker.js manifest.webmanifest js icons vendor _site/
          printf "export const VERSION = '%s';\n" "${VERSION#v}" > _site/js/version.js
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo 'krisperapps.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMchrlhQI1OFJ2cEfQosiydiSPg498c/+Mggebk+zVLO' > ~/.ssh/known_hosts
          rsync -rtz --delete -e 'ssh -i ~/.ssh/deploy' _site/ deploy@krisperapps.de:./
