name: Bug report
description: Something does not work (camera, solver, display)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 16, Safari 26
